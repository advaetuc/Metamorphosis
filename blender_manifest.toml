schema_version = "1.0.0"

id = "metamorphosis"
version = "2.80.0"
name = "MetaMorphosis"
tagline = "MetaHuman head DNA import with RigLogic baked into drivers"
maintainer = "MetaMorphosis <noreply@example.com>"
type = "add-on"

blender_version_min = "5.0.0"

license = ["SPDX:GPL-3.0-or-later"]
copyright = ["2026 MetaMorphosis authors", "2026 Epic Games, Inc. (OpenRigLogic bindings, MIT License)"]

platforms = ["windows-x64"]

tags = ["Rigging", "Animation", "Import-Export"]

[permissions]
files = "Read/write DNA, sculpt preparations and capture tools"
network = "Receive Live Link Face and download optional video tools"

[build]
paths_exclude_pattern = [
  "__pycache__/",
  "*.pyc",
  "work/",
  "tests/",
  "AGENTS.md",
  ".git/",
  ".github/",
  ".gitignore",
  ".gitattributes",
  "METAMORPHOSIS_AI_CONTEXT.md",
  "*.blend1",
  "*.zip",
]
